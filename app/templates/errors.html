{% extends "base.html" %}
{% from "_components.html" import icon, page_header %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<section class="card error-card" aria-labelledby="error-title">
  <svg width="132" height="112" viewBox="0 0 132 112" aria-hidden="true">
    <path d="M66 8 124 102H8L66 8Z" fill="var(--color-neutral-soft)" stroke="var(--color-accent-600)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M66 38v28M66 80h.01" stroke="var(--color-accent-600)" stroke-width="7" stroke-linecap="round"/>
  </svg>
  <h1 id="error-title">We hit a small bump.</h1>
  <p class="muted">{{ message }}</p>
  <a class="btn btn-primary" href="{{ url_for('auth.index') }}">{{ icon('check', 16) }} Go home</a>
</section>
{% endblock %}
